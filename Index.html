<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>What Is My IP Address - See Your Public Address</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Check your IP address and location instantly."/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <style>
    body { font-family: sans-serif; background: #f7fafc; }
    .flag { width: 24px; height: 16px; margin-left: 6px; vertical-align: middle; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-6 flex justify-between items-center">
      <span class="text-2xl font-bold text-blue-600"><i class="fas fa-network-wired mr-2"></i>WhatIsMyIPAddress</span>
    </div>
  </header>

  <main class="flex-1">
    <section class="bg-gradient-to-tr from-blue-100 via-blue-50 to-white py-16">
      <div class="container mx-auto px-4 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold text-blue-700 mb-4">What Is My IP Address?</h1>
        <p class="text-xl text-gray-600 mb-8">Find out your public IP address instantly.</p>

        <div class="inline-block px-8 py-6 rounded-lg shadow-lg bg-white border border-blue-100 mb-5">
          <div class="flex flex-col items-center justify-center">
            <span class="text-lg text-gray-500"><i class="fas fa-globe-americas mr-2 text-blue-500"></i>Your Public IP Address</span>
            <span id="ipAddress" class="mt-2 text-2xl md:text-3xl font-mono text-blue-900">Loading...</span>
            <span id="ipVersion" class="text-sm text-gray-400"></span>
            <span id="ipLocation" class="block text-sm text-gray-600 mt-1"></span>
            <button id="copyBtn" class="mt-3 px-4 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">Copy IP</button>
          </div>
        </div>

        <div class="mt-6 text-left max-w-xl mx-auto">
          <label for="searchIP" class="block text-gray-700 mb-2 font-medium">Search Any IP Address:</label>
          <div class="flex items-center">
            <input id="searchIP" type="text" placeholder="Enter IP address..." class="flex-1 px-4 py-2 border rounded-l text-sm focus:outline-none">
            <button id="searchBtn" class="px-4 py-2 bg-blue-500 text-white rounded-r hover:bg-blue-600">Search</button>
          </div>
          <div id="searchResult" class="mt-3 text-sm text-gray-700"></div>
        </div>

        <p class="text-gray-500 mt-6 text-sm">Powered by ipapi.co</p>
      </div>
    </section>
  </main>

  <footer class="bg-white border-t">
    <div class="container mx-auto px-4 py-6 text-center text-gray-500 text-sm">
      &copy; 2024 WhatIsMyIPAddress - Built for Education
    </div>
  </footer>

  <script>
    async function fetchIP() {
      const ipEl = document.getElementById('ipAddress');
      const ipVersionEl = document.getElementById('ipVersion');
      const ipLocationEl = document.getElementById('ipLocation');
      try {
        const delay = Math.floor(Math.random() * 2000) + 3000;
        await new Promise(resolve => setTimeout(resolve, delay));

        const response = await fetch('https://ipapi.co/json/');
        if (!response.ok) throw new Error("Failed to fetch IP info");
        const data = await response.json();
        ipEl.textContent = data.ip;
        let version = (data.version === 'IPv6') ? 'IPv6' : 'IPv4';
        ipVersionEl.textContent = `(${version})`;
        ipLocationEl.innerHTML = `📍 ${data.city}, ${data.region}, ${data.country_name} — ${data.org} <img src='https://flagcdn.com/24x18/${data.country_code.toLowerCase()}.png' class='flag'>`;
      } catch (e) {
        ipEl.textContent = "Cannot retrieve IP";
        ipVersionEl.textContent = "";
        ipLocationEl.textContent = "";
      }
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      const ip = document.getElementById('ipAddress').textContent;
      navigator.clipboard.writeText(ip).then(() => {
        alert('IP copied to clipboard!');
      });
    });

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const ip = document.getElementById('searchIP').value.trim();
      const resultEl = document.getElementById('searchResult');
      if (!ip) {
        resultEl.textContent = "Please enter a valid IP address.";
        return;
      }
      resultEl.textContent = "Searching...";
      try {
        const response = await fetch(`https://ipapi.co/${ip}/json/`);
        if (!response.ok) throw new Error("Failed to fetch IP info");
        const data = await response.json();
        if (!data || !data.ip) {
          resultEl.textContent = "Invalid IP address or not found.";
          return;
        }
        resultEl.innerHTML = `📍 ${data.city}, ${data.region}, ${data.country_name} — ${data.org} <img src='https://flagcdn.com/24x18/${data.country_code.toLowerCase()}.png' class='flag'>`;
      } catch (err) {
        resultEl.textContent = "Something went wrong. Please try again later.";
      }
    });

    window.addEventListener('DOMContentLoaded', fetchIP);
  </script>
</body>
</html>
